<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project - {{ name }}</title>
    <meta name="title" content="Lee Devin - Project">
    <meta name="keywords" content="">
    <meta name="description" content="">

    <!-- favicon -->
    <link rel="shortcut icon" href="" type="">

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Joan&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Neuton:ital,wght@0,200;0,300;0,400;0,700;0,800;1,400&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- css -->
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="stylesheet" href="../static/css/responsive.css">
  </head>

  <body>

    <!-- --------------------------- HEADER --------------------------- -->

    <header class="site-header">
      <div class="container">

        <a href="{% url 'main:show_main' %}" class="brand">
          {{ name }}
        </a>
        
        <nav>
          <ul class="navbar-ul">

            <li class="navbar-item">
              <a href="{% url 'main:show_main' %}" class="navbar-link">
                PROFILE
              </a>
            </li>

            <li class="navbar-item">
              <a href="{% url 'main:show_experience' %}" class="navbar-link">
                EXPERIENCE
              </a>
            </li>

            <li class="navbar-item">
              <a href="{% url 'main:show_project' %}" class="navbar-link">
                PROJECTS
              </a>
            </li>

          </ul>
        </nav>

      </div>
    </header>

    <main>
      <section class="project" id="project">
        <div class="container">
          <h1>PROJECTS</h1>

          <div class="project-content">
            {% for project in project_list %}
              <article class="project-card">
                <div class="img-container">
                  <img src="{{ project.thumbnail }}" loading="lazy" alt="{{ project.thumbnail_alt }}">
                </div>
                <div class="project-text-wrapper">
                  <h2>{{ project.title }}</h2>
                  <p class="project-description">{{ project.description }}</p>
                </div>
              </article>
            {% empty %}
              <p class="empty-state">
                No projects added yet.
              </p>
            {% endfor %}
          </div>
        </div>
      </section>
    </main>

    <!-- ---------------------------- FOOTER ---------------------------- -->

    <footer class="footer text-center">

      <div class="container">

        <div class="social-media-wrapper">
          <a href="https://www.instagram.com/leedevgerrard/" target="_blank" rel="noopener noreferrer" class="social-media-link instagram-link">
            <ion-icon name="logo-instagram"></ion-icon>
          </a>
          <a href="https://www.linkedin.com/in/lee-devin-gerrard" target="_blank" rel="noopener noreferrer" class="social-media-link linkedin-link">
            <ion-icon name="logo-linkedin"></ion-icon>
          </a>
          <a href="https://www.github.com/leedevgerrard" target="_blank" rel="noopener noreferrer" class="social-media-link linkedin-link">
            <ion-icon name="logo-github"></ion-icon>
          </a>
        </div>

        <div class="footer-copyright">
          <p>&copy; 2026 by {{ name }}</p>
        </div>

      </div>

    </footer>

    <!-- ionicon link -->
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
  </body>
</html>
