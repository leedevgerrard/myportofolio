<div id="add-experience-modal"
     class="experience-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-experience-modal-title">
  <button type="button"
          class="experience-form-modal__backdrop"
          popovertarget="add-experience-modal"
          popovertargetaction="hide"
          aria-label="Close the add experience form"></button>

  <div class="experience-form-modal__content">
    <button type="button"
            class="experience-form-modal__close"
            popovertarget="add-experience-modal"
            popovertargetaction="hide"
            aria-label="Close the add experience form">×</button>

    <h2 id="add-experience-modal-title"
        data-changing-text
        data-add-text="Add New Experience"
        data-edit-text="Update Experience">Add New Experience</h2>
    <form id="experience-form"
          method="post"
          action="{% url 'main:create_experience' %}"
          class="experience-form">
      {% csrf_token %}
      {% for field in form %}
        <div class="form-group">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}
            <p class="form-error">{{ error }}</p>
          {% endfor %}
        </div>
      {% endfor %}
      <div class="experience-form-modal__actions">
        <button type="button"
                id="submit-btn"
                class="button button-secondary"
                popovertarget="add-experience-modal"
                popovertargetaction="hide">Cancel</button>
        <button type="submit"
                class="button"
                data-changing-text
                data-add-text="Add Experience"
                data-edit-text="Save Changes">Add Experience</button>
      </div>
    </form>
  </div>
</div>
